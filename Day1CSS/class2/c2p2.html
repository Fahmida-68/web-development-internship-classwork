<!DOCTYPE html>
<html>
    <head>
        <title>Typography</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&family=Playfair+Display&display=swap" rel="stylesheet" />
        <style>
            body { font-family: 'Poppins', sans-serif; padding: 40px; background: #fafafa; }
            h1 { font-family: 'Playfair Display', serif; font-size: 48px; color: #222; }
            h2 { color: #d9534f; text-transform: uppercase; letter-spacing: 3px; }
            p { line-height: 1.7; color: #444; max-width: 600px; }
            p:first-of-type::first-letter { font-size: 42px; color: #d9534f; font-weight: bold; }
            a { color: #457b9d; }
            a:hover { color: #e63946; text-decoration: none; }
        </style>
    </head>
    <body>
        <h1>The Art of Typography</h1>
        <h2>Introduction</h2>
        <p>Typography is the art of arranging text to make it visually appealing and easy to read. Good typography can make a website look more professional.</p>
        <p>Want to learn more? <a href="#">Click here</a></p>
    </body>
</html>
